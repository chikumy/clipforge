name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
        env: { TEST_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:54329/postgres" }
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true" }

  # Real Supabase stack: auth + PostgREST + the actual migrations (not the test shim).
  e2e-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Export local keys
        run: |
          supabase status -o json > status.json
          echo "status keys: $(jq -r 'keys | join(",")' status.json)"  # names only, no values
          url=$(jq -r '.API_URL // .SUPABASE_URL // empty' status.json)
          key=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // .SUPABASE_PUBLISHABLE_KEY // empty' status.json)
          test -n "$url" && test -n "$key" || { echo "could not find API URL / anon key in supabase status"; exit 1; }
          echo "::add-mask::$key"
          { echo "NEXT_PUBLIC_SUPABASE_URL=$url"; echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key"; echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"; } >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true", E2E_FULL: "1" }
