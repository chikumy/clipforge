name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install ffmpeg
        run: ffprobe -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:54329/postgres"
          REDIS_URL: redis://127.0.0.1:6379
      - name: Start S3 mock (moto)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]"
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -p 5000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:5000/moto-api/ >/dev/null && break; sleep 1; done
      - run: pnpm test:s3
        env:
          S3_ENDPOINT: http://127.0.0.1:5000
          S3_FORCE_PATH_STYLE: "true"
          S3_BUCKET: cf-test
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true" }

  # Real Supabase stack: auth + PostgREST + the actual migrations (not the test shim).
  e2e-journey:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Export local keys
        run: |
          supabase status -o json > status.json
          echo "status keys: $(jq -r 'keys | join(",")' status.json)"  # names only, no values
          url=$(jq -r '.API_URL // .SUPABASE_URL // empty' status.json)
          key=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // .SUPABASE_PUBLISHABLE_KEY // empty' status.json)
          test -n "$url" && test -n "$key" || { echo "could not find API URL / anon key in supabase status"; exit 1; }
          echo "::add-mask::$key"
          { echo "NEXT_PUBLIC_SUPABASE_URL=$url"; echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key"; echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"; } >> "$GITHUB_ENV"
      - name: Install ffmpeg and make a test video
        run: |
          ffprobe -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p "$RUNNER_TEMP/media"
          ffmpeg -v error -f lavfi -i testsrc=duration=2:size=320x240:rate=15 -f lavfi -i sine=duration=2 -c:v libx264 -c:a aac -shortest "$RUNNER_TEMP/media/ok.mp4"
          echo "E2E_VIDEO=$RUNNER_TEMP/media/ok.mp4" >> "$GITHUB_ENV"
      - name: Start S3 mock (moto)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]"
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -p 5000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:5000/moto-api/ >/dev/null && break; sleep 1; done
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:5000 s3 mb s3://cf-e2e
      - name: Storage and queue settings for the app and worker
        run: |
          {
            echo "S3_ENDPOINT=http://127.0.0.1:5000"; echo "S3_FORCE_PATH_STYLE=true"; echo "S3_BUCKET=cf-e2e"
            echo "S3_ACCESS_KEY_ID=test"; echo "S3_SECRET_ACCESS_KEY=test"; echo "REDIS_URL=redis://127.0.0.1:6379"
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          } >> "$GITHUB_ENV"
      - name: Start worker
        run: nohup pnpm --filter worker start > "$RUNNER_TEMP/worker.log" 2>&1 &
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true", E2E_FULL: "1" }
      - name: Worker log
        if: always()
        run: cat "$RUNNER_TEMP/worker.log" || true
