# Local development only. Verified by `supabase start` in CI (e2e-journey job).
project_id = "clipforge"

[api]
port = 54321

[db]
port = 54322

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
minimum_password_length = 10

[auth.email]
enable_signup = true
# Off for local e2e only. Production must keep confirmations on.
enable_confirmations = false
